<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能應用中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="w-full py-6 px-4 sm:px-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-cubes text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-indigo-900 tracking-wide">AppCenter</h1>
            </div>
            <!-- Header Actions (Simulated) -->
            <div class="hidden md:flex space-x-4">
                <button class="text-slate-600 hover:text-indigo-600 font-medium transition">關於我們</button>
                <button class="text-slate-600 hover:text-indigo-600 font-medium transition">幫助</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
        
        <!-- Hero Section -->
        <div class="text-center max-w-3xl mx-auto mb-16">
            <h2 class="text-4xl sm:text-5xl font-extrabold text-slate-900 mb-6 leading-tight">
                歡迎來到 <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">互動應用中心</span>
            </h2>
            <p class="text-lg text-slate-600 mb-8">
                集合了休閒娛樂與實用工具。請選擇下方的應用程式開始您的體驗。
            </p>
        </div>

        <!-- Cards Grid -->
        <div class="max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-8 px-2">
            
            <!-- 1. 俄羅斯方塊 (Tetris) -->
            <a href="tetris.html" class="group block h-full">
                <div class="glass-effect rounded-2xl p-8 h-full card-hover border-t-4 border-purple-500 relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-purple-100 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    
                    <div class="relative z-10 flex flex-col h-full items-center text-center">
                        <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-6 text-3xl shadow-sm group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-gamepad"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-slate-800 mb-3 group-hover:text-purple-700 transition-colors">俄羅斯方塊</h3>
                        <p class="text-slate-500 mb-6 flex-grow">
                            經典的益智消除遊戲。挑戰您的反應速度與策略思維，累積最高分數！
                        </p>
                        <span class="inline-flex items-center justify-center px-6 py-2 border border-transparent text-base font-medium rounded-full text-purple-700 bg-purple-100 group-hover:bg-purple-600 group-hover:text-white transition-all">
                            開始遊戲 <i class="fa-solid fa-arrow-right ml-2"></i>
                        </span>
                    </div>
                </div>
            </a>

            <!-- 2. 幸運輪盤 (Lucky Wheel) -->
            <a href="luckywheel.html" class="group block h-full">
                <div class="glass-effect rounded-2xl p-8 h-full card-hover border-t-4 border-orange-500 relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-orange-100 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    
                    <div class="relative z-10 flex flex-col h-full items-center text-center">
                        <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mb-6 text-3xl shadow-sm group-hover:bg-orange-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-wheelchair-move" style="display:none;"></i> <!-- Hidden fallback -->
                            <i class="fa-solid fa-dharmachakra"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-slate-800 mb-3 group-hover:text-orange-700 transition-colors">幸運輪盤</h3>
                        <p class="text-slate-500 mb-6 flex-grow">
                            今天吃什麼？誰來做這件事？輸入選項，讓輪盤來幫您做出決定！
                        </p>
                        <span class="inline-flex items-center justify-center px-6 py-2 border border-transparent text-base font-medium rounded-full text-orange-700 bg-orange-100 group-hover:bg-orange-600 group-hover:text-white transition-all">
                            試試手氣 <i class="fa-solid fa-arrow-right ml-2"></i>
                        </span>
                    </div>
                </div>
            </a>

            <!-- 3. 班級點名系統 (Roll Call) -->
            <a href="rollcall.html" class="group block h-full">
                <div class="glass-effect rounded-2xl p-8 h-full card-hover border-t-4 border-emerald-500 relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-emerald-100 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    
                    <div class="relative z-10 flex flex-col h-full items-center text-center">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 text-3xl shadow-sm group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-clipboard-user"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-slate-800 mb-3 group-hover:text-emerald-700 transition-colors">班級點名系統</h3>
                        <p class="text-slate-500 mb-6 flex-grow">
                            快速、高效的課堂管理工具。支援名單匯入與隨機抽點功能。
                        </p>
                        <span class="inline-flex items-center justify-center px-6 py-2 border border-transparent text-base font-medium rounded-full text-emerald-700 bg-emerald-100 group-hover:bg-emerald-600 group-hover:text-white transition-all">
                            進入系統 <i class="fa-solid fa-arrow-right ml-2"></i>
                        </span>
                    </div>
                </div>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2023 多功能應用中心. All rights reserved.</p>
    </footer>

</body>
</html>
