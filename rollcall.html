<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級點名系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body {
            background-color: #f8fafc; /* slate-50 */
        }
    </style>
</head>
<body class="text-slate-800 font-sans pb-20">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-50 flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="flex flex-col items-center gap-4">
            <i data-lucide="loader-2" class="w-10 h-10 text-blue-600 animate-spin"></i>
            <p id="loading-text" class="text-slate-500 font-medium">正在載入班級資料...</p>
        </div>
    </div>

    <!-- Header Section -->
    <header class="bg-white shadow-sm sticky top-0 z-10 border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="clipboard-list" class="w-7 h-7 text-blue-600"></i>
                        班級點名系統
                    </h1>
                    <p class="text-slate-500 text-sm mt-1">輕鬆管理學生出席狀況</p>
                </div>
                
                <div class="flex items-center gap-3 bg-slate-100 p-1.5 rounded-lg">
                    <i data-lucide="calendar" class="w-5 h-5 text-slate-500 ml-2"></i>
                    <input type="date" id="date-picker" class="bg-transparent border-none text-slate-700 font-medium focus:ring-0 p-1 outline-none">
                </div>
            </div>

            <!-- Stats Bar -->
            <div id="stats-container" class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-6 hidden">
                <!-- Will be populated by JS -->
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Actions Bar -->
        <div class="flex flex-wrap gap-3 justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                 <button id="btn-copy" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm transition-colors text-sm font-medium">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                    複製報告
                </button>
                <button id="btn-reset" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-slate-50 border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg shadow-sm transition-colors text-sm font-medium">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    重置今日
                </button>
            </div>
            
            <div class="w-full md:w-auto text-center md:text-right text-sm font-medium text-slate-500 mt-2 md:mt-0">
                出席率: <span id="attendance-rate" class="text-orange-500">0%</span>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div id="bulk-actions" class="grid grid-cols-2 md:grid-cols-4 gap-2 hidden">
            <button onclick="app.handleBulkStatus('present')" class="flex items-center justify-center gap-2 px-3 py-2 bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 rounded-lg text-sm font-medium transition-colors">
                <i data-lucide="check-circle" class="w-4 h-4"></i> 全選出席
            </button>
            <button onclick="app.handleBulkStatus('absent')" class="flex items-center justify-center gap-2 px-3 py-2 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg text-sm font-medium transition-colors">
                <i data-lucide="x-circle" class="w-4 h-4"></i> 全選缺席
            </button>
            <button onclick="app.handleBulkStatus('late')" class="flex items-center justify-center gap-2 px-3 py-2 bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 rounded-lg text-sm font-medium transition-colors">
                <i data-lucide="clock" class="w-4 h-4"></i> 全選遲到
            </button>
            <button onclick="app.handleBulkStatus('excused')" class="flex items-center justify-center gap-2 px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 rounded-lg text-sm font-medium transition-colors">
                <i data-lucide="minus-circle" class="w-4 h-4"></i> 全選請假
            </button>
        </div>

        <!-- Add Student Form -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row gap-3">
                <form id="form-add-student" class="flex-1 flex gap-3">
                    <div class="relative flex-1">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2">
                            <i data-lucide="users" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input
                            type="text"
                            id="input-student-name"
                            placeholder="輸入學生姓名新增..."
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                        />
                    </div>
                    <button 
                        type="submit" 
                        id="btn-add"
                        disabled
                        class="px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 font-medium whitespace-nowrap"
                    >
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">新增</span>
                    </button>
                </form>

                <!-- Quick Add 1-30 -->
                <button 
                    id="btn-batch-add"
                    class="px-4 py-2 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-200 transition-colors flex items-center justify-center gap-2 font-medium whitespace-nowrap disabled:opacity-50"
                    title="快速建立 1-30 號學生"
                >
                    <i data-lucide="list-plus" class="w-4 h-4"></i>
                    <span class="hidden md:inline">快速加入 1-30 號</span>
                    <span class="md:hidden">1-30號</span>
                </button>
            </div>
        </div>

        <!-- Student List -->
        <div id="student-list-container" class="space-y-3">
            <!-- Empty State -->
            <div id="empty-state" class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 hidden">
                <div class="flex justify-center mb-3">
                    <i data-lucide="users" class="w-12 h-12 text-slate-300"></i>
                </div>
                <p class="text-slate-500">尚未建立學生名單</p>
                <p class="text-slate-400 text-sm mt-1">請在上方輸入姓名或點擊「1-30號」快速建立</p>
            </div>
            <!-- List Items will be injected here -->
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- Global App Object for event handlers ---
        window.app = {
            handleBulkStatus: null, // Will be assigned later
        };

        // --- Firebase Init ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- State ---
        let state = {
            user: null,
            students: [],
            attendance: {},
            date: new Date().toISOString().split('T')[0],
            isAddingBatch: false
        };

        // --- DOM Elements ---
        const els = {
            loadingScreen: document.getElementById('loading-screen'),
            loadingText: document.getElementById('loading-text'),
            datePicker: document.getElementById('date-picker'),
            statsContainer: document.getElementById('stats-container'),
            studentList: document.getElementById('student-list-container'),
            emptyState: document.getElementById('empty-state'),
            btnAdd: document.getElementById('btn-add'),
            inputName: document.getElementById('input-student-name'),
            bulkActions: document.getElementById('bulk-actions'),
            rateText: document.getElementById('attendance-rate'),
            btnBatchAdd: document.getElementById('btn-batch-add'),
            btnCopy: document.getElementById('btn-copy'),
            btnReset: document.getElementById('btn-reset'),
            formAdd: document.getElementById('form-add-student')
        };

        // --- Initialization ---
        async function init() {
            els.datePicker.value = state.date;
            lucide.createIcons();

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                els.loadingScreen.classList.add('hidden'); // Force hide if auth fails
                alert("登入失敗，請重新整理網頁");
            }

            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    setupDataListeners(user);
                } else {
                    // If for some reason user is null (unlikely after successful await)
                    console.warn("User not logged in");
                    els.loadingScreen.classList.add('hidden');
                }
            });

            setupEventListeners();
        }

        // --- Data Listeners ---
        function setupDataListeners(user) {
            // Students Listener
            const studentsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'students');
            onSnapshot(studentsRef, (snapshot) => {
                const loadedStudents = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Sort logic (Numeric then created time)
                loadedStudents.sort((a, b) => {
                    const numA = parseInt(a.name.replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.name.replace(/\D/g, '')) || 0;
                    
                    if (numA > 0 && numB > 0 && numA !== numB) {
                        return numA - numB;
                    }
                    return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
                });

                state.students = loadedStudents;
                render();
                // Hide loading screen once initial data is loaded (or even if empty)
                els.loadingScreen.classList.add('hidden');
            }, (error) => {
                // Error Handler
                console.error("Error fetching students:", error);
                els.loadingText.textContent = "載入失敗";
                setTimeout(() => {
                    els.loadingScreen.classList.add('hidden');
                }, 500);
            });

            // Attendance Listener
            subscribeToAttendanceDate(state.date);
        }

        let unsubscribeAttendance = null;
        function subscribeToAttendanceDate(dateStr) {
            if (unsubscribeAttendance) unsubscribeAttendance();
            if (!state.user) return;

            const dateDocRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'daily_attendance', dateStr);
            unsubscribeAttendance = onSnapshot(dateDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    state.attendance = docSnap.data().records || {};
                } else {
                    state.attendance = {};
                }
                render();
            }, (error) => {
                console.error("Error fetching attendance:", error);
            });
        }

        // --- Rendering ---
        function render() {
            renderStudentList();
            renderStats();
            updateUIState();
            lucide.createIcons(); // Refresh icons for new elements
        }

        function updateUIState() {
            if (state.students.length > 0) {
                els.emptyState.classList.add('hidden');
                els.statsContainer.classList.remove('hidden');
                els.bulkActions.classList.remove('hidden');
            } else {
                els.emptyState.classList.remove('hidden');
                els.statsContainer.classList.add('hidden');
                els.bulkActions.classList.add('hidden');
            }

            if (state.isAddingBatch) {
                els.btnBatchAdd.disabled = true;
                els.btnBatchAdd.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 處理中...`;
            } else {
                els.btnBatchAdd.disabled = false;
                els.btnBatchAdd.innerHTML = `<i data-lucide="list-plus" class="w-4 h-4"></i> <span class="hidden md:inline">快速加入 1-30 號</span><span class="md:hidden">1-30號</span>`;
            }
        }

        function renderStats() {
            const stats = { present: 0, absent: 0, late: 0, excused: 0, totalMarked: 0 };
            Object.values(state.attendance).forEach(status => {
                if (stats[status] !== undefined) {
                    stats[status]++;
                    stats.totalMarked++;
                }
            });

            const progress = state.students.length > 0 ? Math.round((stats.present / state.students.length) * 100) : 0;
            els.rateText.textContent = `${progress}%`;
            els.rateText.className = progress >= 80 ? 'text-green-600' : 'text-orange-500';

            // Helper to create stat card HTML
            const createCard = (label, count, colorClass) => `
                <div class="flex flex-col items-center justify-center p-3 rounded-lg ${colorClass}">
                    <span class="text-2xl font-bold">${count}</span>
                    <span class="text-xs font-medium opacity-80">${label}</span>
                </div>
            `;

            els.statsContainer.innerHTML = `
                ${createCard('應到人數', state.students.length, 'bg-slate-100 text-slate-600')}
                ${createCard('出席', stats.present, 'bg-green-100 text-green-700')}
                ${createCard('缺席', stats.absent, 'bg-red-100 text-red-700')}
                ${createCard('遲到', stats.late, 'bg-orange-100 text-orange-700')}
                ${createCard('請假', stats.excused, 'bg-gray-100 text-gray-600')}
            `;
        }

        function renderStudentList() {
            // Clear existing list except empty state
            Array.from(els.studentList.children).forEach(child => {
                if (child.id !== 'empty-state') child.remove();
            });

            state.students.forEach(student => {
                const status = state.attendance[student.id];
                const row = document.createElement('div');
                
                // Determine Styles
                let rowClass = 'bg-white border-slate-200';
                let avatarClass = 'bg-slate-100 text-slate-500';
                let statusText = '尚未點名';

                if (status === 'present') { rowClass = 'bg-green-50 border-green-200'; avatarClass = 'bg-green-100 text-green-700'; statusText = '已出席'; }
                else if (status === 'absent') { rowClass = 'bg-red-50 border-red-200'; avatarClass = 'bg-red-100 text-red-700'; statusText = '缺席'; }
                else if (status === 'late') { rowClass = 'bg-orange-50 border-orange-200'; avatarClass = 'bg-orange-100 text-orange-700'; statusText = '遲到'; }
                else if (status === 'excused') { rowClass = 'bg-gray-100 border-gray-200'; avatarClass = 'bg-gray-200 text-gray-700'; statusText = '請假'; }

                row.className = `group flex flex-col sm:flex-row items-start sm:items-center gap-4 p-4 rounded-xl border transition-all duration-200 shadow-sm ${rowClass}`;
                
                // Extract number or initial
                const initial = student.name.replace(/[^0-9]/g, '') || student.name.charAt(0);

                row.innerHTML = `
                    <div class="flex-1 min-w-0 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold ${avatarClass}">
                            ${initial}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-bold text-slate-800 truncate text-lg">${student.name}</h3>
                            <p class="text-xs text-slate-500 font-medium">${statusText}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 no-scrollbar">
                        ${createStatusButton(student.id, 'present', 'check-circle', '出席', status === 'present', 'text-green-600 bg-green-50 hover:bg-green-100 border-green-200', 'bg-green-600 text-white border-green-600 ring-2 ring-green-200')}
                        ${createStatusButton(student.id, 'absent', 'x-circle', '缺席', status === 'absent', 'text-red-600 bg-red-50 hover:bg-red-100 border-red-200', 'bg-red-600 text-white border-red-600 ring-2 ring-red-200')}
                        ${createStatusButton(student.id, 'late', 'clock', '遲到', status === 'late', 'text-orange-600 bg-orange-50 hover:bg-orange-100 border-orange-200', 'bg-orange-500 text-white border-orange-500 ring-2 ring-orange-200')}
                        ${createStatusButton(student.id, 'excused', 'minus-circle', '請假', status === 'excused', 'text-gray-600 bg-gray-50 hover:bg-gray-100 border-gray-200', 'bg-slate-500 text-white border-slate-500 ring-2 ring-gray-200')}
                        <div class="w-px h-8 bg-slate-300 mx-1 hidden sm:block"></div>
                        <button onclick="app.deleteStudent('${student.id}')" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors ml-auto sm:ml-0" title="刪除學生">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
                els.studentList.appendChild(row);
            });
        }

        function createStatusButton(id, status, iconName, label, isActive, colorClass, activeClass) {
            const classes = isActive ? activeClass : `bg-white hover:shadow-sm ${colorClass}`;
            return `
                <button onclick="app.updateStatus('${id}', '${status}')" class="flex flex-col sm:flex-row items-center gap-1.5 px-3 py-2 rounded-lg border transition-all duration-200 flex-1 sm:flex-none justify-center min-w-[70px] sm:min-w-[auto] ${classes}">
                    <i data-lucide="${iconName}" class="w-5 h-5 ${isActive ? 'text-white' : ''}"></i>
                    <span class="text-xs sm:text-sm font-medium">${label}</span>
                </button>
            `;
        }


        // --- Actions & Handlers ---

        async function saveAttendance(newData) {
            if (!state.user) return;
            const dateDocRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'daily_attendance', state.date);
            try {
                await setDoc(dateDocRef, {
                    date: state.date,
                    records: newData,
                    lastUpdated: serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error("Save failed", e);
            }
        }

        // Exported actions for HTML onClick attributes
        window.app.updateStatus = async (studentId, status) => {
            const newData = { ...state.attendance, [studentId]: status };
            // Optimistic update handled by listener usually, but for vanilla JS we rely on listener to re-render
            // Or we can manually trigger render here for instant feedback if network is slow,
            // but Firestore local cache is usually fast enough.
            await saveAttendance(newData);
        };

        window.app.deleteStudent = async (studentId) => {
             if (!confirm('確定要刪除這位學生嗎？這也會影響歷史紀錄。')) return;
             try {
                 await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'students', studentId));
                 const newData = { ...state.attendance };
                 delete newData[studentId];
                 await saveAttendance(newData);
             } catch (e) {
                 console.error("Delete failed", e);
             }
        };

        window.app.handleBulkStatus = async (status) => {
            if (!state.user || state.students.length === 0) return;
            // No confirm as requested
            const newData = { ...state.attendance };
            state.students.forEach(s => newData[s.id] = status);
            await saveAttendance(newData);
        };

        // --- Event Listeners ---
        function setupEventListeners() {
            // Date Picker
            els.datePicker.addEventListener('change', (e) => {
                state.date = e.target.value;
                subscribeToAttendanceDate(state.date);
            });

            // Input Validation
            els.inputName.addEventListener('input', (e) => {
                els.btnAdd.disabled = !e.target.value.trim();
            });

            // Add Student
            els.formAdd.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = els.inputName.value.trim();
                if (!name || !state.user) return;

                els.inputName.value = '';
                els.btnAdd.disabled = true;

                try {
                    const newDocRef = doc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'students'));
                    await setDoc(newDocRef, {
                        name: name,
                        createdAt: serverTimestamp()
                    });
                } catch (err) {
                    console.error("Add student failed", err);
                    els.inputName.value = name; // revert
                }
            });

            // Batch Add
            els.btnBatchAdd.addEventListener('click', async () => {
                 if (!state.user) return;
                 if (state.students.length > 0 && !confirm('目前已有學生名單，確定要額外加入 1號 到 30號 學生嗎？')) return;
                 
                 state.isAddingBatch = true;
                 updateUIState(); // show loading

                 try {
                     const promises = [];
                     for (let i = 1; i <= 30; i++) {
                        const newDocRef = doc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'students'));
                        promises.push(setDoc(newDocRef, {
                            name: `${i}號學生`,
                            createdAt: serverTimestamp()
                        }));
                    }
                    await Promise.all(promises);
                 } catch (err) {
                     alert("新增失敗");
                 } finally {
                     state.isAddingBatch = false;
                     updateUIState();
                 }
            });

            // Reset Day
            els.btnReset.addEventListener('click', async () => {
                // No confirm
                state.attendance = {}; // Optimistic
                render();
                
                if (!state.user) return;
                try {
                    const dateDocRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'daily_attendance', state.date);
                    await deleteDoc(dateDocRef);
                } catch(e) {
                    console.error(e);
                }
            });

            // Copy
            els.btnCopy.addEventListener('click', () => {
                const stats = { present: 0, absent: 0, late: 0, excused: 0, totalMarked: 0 };
                Object.values(state.attendance).forEach(status => {
                    if (stats[status] !== undefined) {
                        stats[status]++;
                        stats.totalMarked++;
                    }
                });

                const getNames = (status) => state.students
                    .filter(s => state.attendance[s.id] === status)
                    .map(s => s.name).join(', ');

                const text = `
📅 日期：${state.date}
------------------
📊 應到：${state.students.length} 人
✅ 出席：${stats.present} 人
❌ 缺席：${stats.absent} 人
⚠️ 遲到：${stats.late} 人
📝 請假：${stats.excused} 人
❓ 未點：${state.students.length - stats.totalMarked} 人
------------------
${stats.absent > 0 ? `❌ 缺席名單：${getNames('absent')}\n` : ''}${stats.late > 0 ? `⚠️ 遲到名單：${getNames('late')}\n` : ''}${stats.excused > 0 ? `📝 請假名單：${getNames('excused')}` : ''}
                `.trim();

                fallbackCopyTextToClipboard(text);
            });
        }

        // Fallback Copy
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) alert('點名摘要已複製到剪貼簿！');
                else alert('複製失敗');
            } catch (err) {
                alert('複製功能受限，請手動複製');
            }
            document.body.removeChild(textArea);
        }

        // Start
        init();

    </script>
</body>
</html>
